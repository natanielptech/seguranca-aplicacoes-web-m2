spring.application.name=laboratorio-sqli

# Banco H2 em memória: nasce vazio a cada start e é recriado por schema.sql + data.sql
spring.datasource.url=jdbc:h2:mem:laboratorio;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Somente para fins didáticos: mostra o SQL executado pelo Spring no console
logging.level.org.springframework.jdbc.core=DEBUG
